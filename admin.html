<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — unused</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--indigo:#3D3BF3;--indigo-d:#2A28C8;--indigo-pale:#EEEEFF;--cream:#FAF8F2;--cream-d:#EEEAE0;--ink:#12111E;--muted:#7B7A9A;--border:rgba(61,59,243,.1);--r:12px;--r-sm:8px;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Bricolage Grotesque',sans-serif;background:#0F0E1A;color:#E8E6FF;-webkit-font-smoothing:antialiased;min-height:100vh;}
.nav{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:#1A1828;border-bottom:1px solid rgba(255,255,255,.06);}
.logo{font-size:1rem;font-weight:800;letter-spacing:-.04em;color:white;display:flex;align-items:center;gap:8px;}
.logo-dot{width:6px;height:6px;background:var(--indigo);border-radius:50%;}
.admin-badge{font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:rgba(61,59,243,.3);color:#9B99FF;padding:3px 10px;border-radius:100px;}
.page{max-width:900px;margin:0 auto;padding:32px 24px 60px;}

/* Auth gate */
.auth-gate{max-width:360px;margin:80px auto;text-align:center;}
.auth-gate h2{font-size:1.2rem;font-weight:800;margin-bottom:16px;color:white;}
.auth-input{width:100%;padding:12px 16px;background:#1A1828;border:1.5px solid rgba(255,255,255,.1);border-radius:var(--r-sm);font-family:inherit;font-size:.9rem;color:white;outline:none;letter-spacing:.08em;text-align:center;transition:border-color .18s;}
.auth-input:focus{border-color:var(--indigo);}
.auth-btn{margin-top:12px;width:100%;padding:12px;background:var(--indigo);color:white;border:none;border-radius:var(--r-sm);font-family:inherit;font-weight:700;font-size:.9rem;cursor:pointer;transition:background .18s;}
.auth-btn:hover{background:var(--indigo-d);}
.auth-err{font-size:.78rem;color:#FC8181;margin-top:8px;display:none;}

/* Dashboard */
#dashboard{display:none;}
.section-title{font-size:.65rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#7B79AA;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.06);}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:32px;}
.stat-card{background:#1A1828;border:1px solid rgba(255,255,255,.06);border-radius:var(--r);padding:18px 20px;}
.stat-value{font-size:1.8rem;font-weight:800;color:white;letter-spacing:-.04em;}
.stat-label{font-size:.72rem;color:#7B79AA;margin-top:4px;}

/* Table */
.table-wrap{background:#1A1828;border:1px solid rgba(255,255,255,.06);border-radius:var(--r);overflow:hidden;margin-bottom:32px;}
.table-header{padding:14px 20px;font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#7B79AA;border-bottom:1px solid rgba(255,255,255,.06);}
.sig-row{padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.04);display:grid;grid-template-columns:1fr 140px 100px 120px;gap:12px;align-items:center;}
.sig-row:last-child{border-bottom:none;}
.sig-row:hover{background:rgba(255,255,255,.02);}
.sig-title{font-size:.88rem;font-weight:600;color:white;margin-bottom:3px;}
.sig-meta{font-size:.72rem;color:#7B79AA;}
.sig-ref{font-family:monospace;font-size:.75rem;color:#9B99FF;letter-spacing:.06em;}
.status-badge{display:inline-block;font-size:.66rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:100px;}
.s-pending_owner{background:rgba(246,173,85,.15);color:#F6AD55;}
.s-owner_refused{background:rgba(229,62,62,.12);color:#FC8181;}
.s-pending_payment{background:rgba(154,230,180,.12);color:#68D391;}
.s-pending_confirmation{background:rgba(99,179,237,.12);color:#63B3ED;}
.s-completed{background:rgba(72,187,120,.15);color:#48BB78;}
.btn-confirm{padding:7px 14px;background:var(--indigo);color:white;border:none;border-radius:var(--r-sm);font-family:inherit;font-weight:700;font-size:.76rem;cursor:pointer;transition:background .18s;white-space:nowrap;}
.btn-confirm:hover{background:var(--indigo-d);}
.btn-confirm:disabled{opacity:.4;cursor:not-allowed;}
.empty{padding:32px;text-align:center;color:#7B79AA;font-size:.88rem;}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:white;color:var(--ink);padding:10px 20px;border-radius:100px;font-size:.82rem;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;}
.toast.show{opacity:1;}
</style>
</head>
<body>
<nav class="nav">
  <div class="logo"><span class="logo-dot"></span>UNUSED</div>
  <span class="admin-badge">⚙️ Admin</span>
</nav>
<div class="page">

  <!-- AUTH -->
  <div id="auth-gate" class="auth-gate">
    <h2>Accès administrateur</h2>
    <input type="password" class="auth-input" id="admin-pwd" placeholder="Mot de passe" onkeydown="if(event.key==='Enter')checkAuth()">
    <button class="auth-btn" onclick="checkAuth()">Connexion</button>
    <p class="auth-err" id="auth-err">Mot de passe incorrect.</p>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard">
    <div style="margin-bottom:28px">
      <h1 style="font-size:1.4rem;font-weight:800;color:white;margin-bottom:4px">Tableau de bord</h1>
      <p style="font-size:.82rem;color:#7B79AA">Gestion des mises en relation · <span id="last-refresh">—</span> · <button onclick="loadAll()" style="background:none;border:none;color:var(--indigo);font-family:inherit;font-size:.82rem;cursor:pointer;font-weight:600">↻ Actualiser</button></p>
    </div>

    <!-- STATS -->
    <div class="section-title">Vue d'ensemble</div>
    <div class="stats">
      <div class="stat-card"><div class="stat-value" id="stat-total">—</div><div class="stat-label">Total demandes</div></div>
      <div class="stat-card"><div class="stat-value" id="stat-pending-owner" style="color:#F6AD55">—</div><div class="stat-label">En attente proprio</div></div>
      <div class="stat-card"><div class="stat-value" id="stat-pending-payment" style="color:#68D391">—</div><div class="stat-label">En attente paiement</div></div>
      <div class="stat-card"><div class="stat-value" id="stat-completed" style="color:#48BB78">—</div><div class="stat-label">Finalisées</div></div>
    </div>

    <!-- À CONFIRMER (pending_payment) -->
    <div class="section-title">💳 Virements à confirmer</div>
    <div class="table-wrap">
      <div id="payment-list"><div class="empty">Aucun virement en attente.</div></div>
    </div>

    <!-- TOUTES LES DEMANDES -->
    <div class="section-title">📋 Toutes les demandes</div>
    <div class="table-wrap">
      <div id="all-list"><div class="empty">Chargement…</div></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
var SUPABASE_URL="https://wncoflfsrorictwndffa.supabase.co";
var SUPABASE_KEY="sb_publishable_Qwz9qffUkYNm04rGayB2PQ_otMJD1X3";
var API=SUPABASE_URL+"/rest/v1";
var H={"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json","Prefer":"return=representation"};
var HP={"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json","Prefer":"return=minimal"};

// ── Auth (mot de passe local simple — à changer avant déploiement)
// CHANGE CE MOT DE PASSE AVANT DE DÉPLOYER
var ADMIN_PWD = "unused2026admin";

function checkAuth(){
  var pwd=document.getElementById("admin-pwd").value;
  if(pwd===ADMIN_PWD){
    document.getElementById("auth-gate").style.display="none";
    document.getElementById("dashboard").style.display="block";
    loadAll();
  } else {
    document.getElementById("auth-err").style.display="block";
  }
}

function showToast(msg){var t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(function(){t.classList.remove("show");},2500);}

function fmtDate(iso){if(!iso)return "—";var d=new Date(iso);return d.toLocaleDateString("fr-FR")+" "+d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});}

function statusLabel(s){
  var map={"pending_owner":"⏳ Attente proprio","owner_refused":"❌ Refusé","pending_payment":"💳 Attente paiement","pending_confirmation":"🔍 Virement reçu ?","completed":"✅ Finalisé"};
  return map[s]||s;
}

async function loadAll(){
  document.getElementById("last-refresh").textContent="Actualisé à "+new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
  try{
    var r=await fetch(API+"/signatures?select=*&order=created_at.desc",{headers:H});
    var sigs=await r.json();

    // Stats
    document.getElementById("stat-total").textContent=sigs.length;
    document.getElementById("stat-pending-owner").textContent=sigs.filter(function(s){return s.status==="pending_owner";}).length;
    document.getElementById("stat-pending-payment").textContent=sigs.filter(function(s){return s.status==="pending_payment"||s.status==="pending_confirmation";}).length;
    document.getElementById("stat-completed").textContent=sigs.filter(function(s){return s.status==="completed";}).length;

    // Payment list
    var toConfirm=sigs.filter(function(s){return s.status==="pending_payment"||s.status==="pending_confirmation";});
    var payEl=document.getElementById("payment-list");
    if(toConfirm.length===0){payEl.innerHTML='<div class="empty">Aucun virement en attente. 🎉</div>';}
    else{payEl.innerHTML=toConfirm.map(function(s){return sigRow(s,true);}).join("");}

    // All list
    var allEl=document.getElementById("all-list");
    if(sigs.length===0){allEl.innerHTML='<div class="empty">Aucune demande pour l\'instant.</div>';}
    else{allEl.innerHTML=sigs.map(function(s){return sigRow(s,false);}).join("");}

  }catch(e){showToast("Erreur chargement : "+e.message);}
}

function sigRow(s, showConfirmBtn){
  var statusClass="s-"+s.status;
  var confirmBtn=showConfirmBtn
    ? '<button class="btn-confirm" onclick="confirmPayment(\''+s.payment_token+'\',\''+s.tenant_name+'\',\''+s.tenant_email+'\',\''+s.owner_name+'\',\''+s.owner_email+'\',\''+(s.owner_phone||'')+'\',\''+s.listing_title+'\',\''+s.listing_quartier+'\',\''+s.listing_price+'\',\''+s.payment_ref+'\')">✅ Confirmer</button>'
    : '<span style="font-size:.72rem;color:#7B79AA">'+fmtDate(s.created_at)+'</span>';
  return '<div class="sig-row">'+
    '<div>'+
      '<div class="sig-title">'+escHtml(s.listing_title||"—")+'</div>'+
      '<div class="sig-meta">'+escHtml(s.tenant_name||"—")+' · '+escHtml(s.tenant_email||"—")+'</div>'+
      '<div class="sig-meta" style="margin-top:2px">Proprio : '+escHtml(s.owner_name||"—")+'</div>'+
    '</div>'+
    '<div class="sig-ref">'+escHtml(s.payment_ref||"—")+'</div>'+
    '<span class="status-badge '+statusClass+'">'+statusLabel(s.status)+'</span>'+
    '<div>'+confirmBtn+'</div>'+
  '</div>';
}

function escHtml(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

async function confirmPayment(payToken, tenantName, tenantEmail, ownerName, ownerEmail, ownerPhone, listingTitle, listingQuartier, listingPrice, payRef){
  if(!confirm("Confirmer le paiement de "+payRef+" et envoyer les coordonnées aux deux parties ?"))return;
  try{
    var now=new Date().toISOString();
    var r=await fetch(API+"/signatures?payment_token=eq."+payToken,{
      method:"PATCH",headers:HP,
      body:JSON.stringify({status:"completed",payment_confirmed_at:now})
    });
    if(!r.ok)throw new Error(await r.text());

    // Email de confirmation aux deux parties (via mailto unused)
    var subj=encodeURIComponent("[unused] Mise en relation finalisée — "+listingTitle);
    var body=encodeURIComponent([
      "Bonjour,",
      "",
      "La mise en relation pour l'espace « "+listingTitle+" » ("+listingQuartier+", "+listingPrice+"€/mois) est finalisée.",
      "Réf. paiement : "+payRef,
      "",
      "=== COORDONNÉES PROPRIÉTAIRE ===",
      "Nom : "+ownerName,
      "Email : "+ownerEmail,
      (ownerPhone ? "Téléphone : "+ownerPhone : ""),
      "",
      "=== COORDONNÉES LOCATAIRE ===",
      "Nom : "+tenantName,
      "Email : "+tenantEmail,
      "",
      "Pensez à établir un contrat de mise à disposition :",
      window.location.origin+"/contrat-stockage.html",
      "",
      "— unused · unused.lille@gmail.com"
    ].filter(Boolean).join("\n"));
    window.location.href="mailto:unused.lille@gmail.com?subject="+subj+"&body="+body;

    showToast("✅ Paiement confirmé !");
    setTimeout(loadAll, 500);
  }catch(e){showToast("Erreur : "+e.message);}
}
</script>
</body>
</html>
